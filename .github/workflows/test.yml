# Runs the library's tests on every push to master and every pull request.
name: Test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # The JVM tests exercise the whole engine; the other targets are compiled so that a
      # platform-specific break is caught before a publish.
      - name: Test
        run: >
          gradle :pulse-test:jvmTest checkKotlinAbi
          :pulse:compileKotlinJs :pulse:compileKotlinWasmJs :pulse:compileKotlinIosArm64
          :pulse-viewmodel:compileKotlinJs :pulse-compose:compileKotlinJs
          --stacktrace
